# 在 GitHub 的苹果电脑上把 ios/ 里的壳子编成安装包（没签名的 ipa），放到 Releases 里的「ios-latest」
name: ios
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成工程
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: 编译
        run: |
          cd ios
          xcodebuild -project Deer.xcodeproj -target Deer -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: 打成安装包
        run: |
          cd ios
          mkdir Payload
          cp -R build/Release-iphoneos/Deer.app Payload/
          zip -qry Deer.ipa Payload
          ls -la Deer.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Deer-ipa
          path: ios/Deer.ipa
      - name: 放到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          sleep 3
          gh release create ios-latest ios/Deer.ipa --title "🦌 iPhone 安装包" --notes "没有签名的安装包。用自签工具（Sideloadly、爱思助手等）签上你自己的 Apple ID 再装到 iPhone。"
